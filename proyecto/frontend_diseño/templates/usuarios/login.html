<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión — GestorDoc</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0D47A1 0%, #1976D2 60%, #1E88E5 100%);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-container { width: 100%; max-width: 420px; padding: 1rem; }
    .login-card {
      background: #FFFFFF;
      border-radius: 14px;
      padding: 2.5rem 2rem;
      box-shadow: 0 8px 32px rgba(0,0,0,0.25);
    }
    .login-brand {
      text-align: center;
      margin-bottom: 2rem;
    }
    .login-brand .brand-icon {
      font-size: 3rem;
      color: #1565C0;
    }
    .login-brand h1 {
      font-size: 1.8rem;
      font-weight: 700;
      color: #0D47A1;
      margin-top: 0.4rem;
      margin-bottom: 0.2rem;
    }
    .login-brand p { color: #6C757D; font-size: 0.9rem; margin: 0; }
    .form-label { font-weight: 500; color: #495057; font-size: 0.9rem; }
    .btn-login {
      background: linear-gradient(90deg, #1565C0, #1976D2);
      border: none;
      color: #fff;
      font-weight: 600;
      letter-spacing: 0.5px;
      padding: 0.65rem;
    }
    .btn-login:hover { background: linear-gradient(90deg, #0D47A1, #1565C0); color: #fff; }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-brand">
        <div class="brand-icon"><i class="bi bi-archive-fill"></i></div>
        <h1>GestorDoc</h1>
        <p>Sistema Gestor Documental</p>
      </div>

      {% if error %}
        <div class="alert alert-danger alert-dismissible fade show" role="alert">
          <i class="bi bi-exclamation-circle me-1"></i> {{ error }}
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
      {% endif %}

      <form method="post" action="">
        {% csrf_token %}

        <div class="mb-3">
          <label for="correo" class="form-label">Correo Electrónico</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
            <input type="email" id="correo" name="correo" class="form-control"
                   placeholder="usuario@ejemplo.com" required autofocus>
          </div>
        </div>

        <div class="mb-4">
          <label for="contrasena" class="form-label">Contraseña</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input type="password" id="contrasena" name="contrasena" class="form-control"
                   placeholder="Ingrese su contraseña" required>
            <button type="button" id="togglePassword" class="btn btn-outline-secondary">
              <i class="bi bi-eye" id="toggleIcon"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-login w-100">
          <i class="bi bi-box-arrow-in-right me-2"></i> Iniciar Sesión
        </button>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.getElementById('togglePassword').addEventListener('click', function() {
      const pwd = document.getElementById('contrasena');
      const icon = document.getElementById('toggleIcon');
      if (pwd.type === 'password') {
        pwd.type = 'text';
        icon.classList.replace('bi-eye', 'bi-eye-slash');
      } else {
        pwd.type = 'password';
        icon.classList.replace('bi-eye-slash', 'bi-eye');
      }
    });
  </script>
</body>
</html>
