# Sitio gestor.filosdev.com - Sistema Gestor Documental
#
# Copiar a /etc/nginx/sites-available/gestor.filosdev.com y enlazar en
# sites-enabled. Certbot agrega después el bloque HTTPS (puerto 443).
#
#   /            -> página principal (plantilla adaptada, archivo estático)
#   /sitio/      -> recursos de la página principal (css, imágenes, js)
#   /movil/      -> versión web de la app móvil (archivos estáticos)
#   /static/     -> archivos estáticos de Django (collectstatic)
#   /media/      -> documentos cargados por los usuarios
#   todo lo demás (login, dashboard, documentos, api, admin) -> Gunicorn

upstream gestor_documental {
    server 127.0.0.1:8001;
}

server {
    listen 80;
    listen [::]:80;
    server_name gestor.filosdev.com;

    client_max_body_size 20M;

    access_log /var/log/nginx/gestor.filosdev.com.access.log;
    error_log  /var/log/nginx/gestor.filosdev.com.error.log;

    location = / {
        root /opt/gestor-documental/proyecto/despliegue/landing;
        try_files /index.html =404;
    }

    location /sitio/ {
        alias /opt/gestor-documental/proyecto/despliegue/landing/;
        expires 7d;
    }

    location /movil/ {
        alias /opt/gestor-documental/proyecto/despliegue/movil/;
        index index.html;
    }

    location /static/ {
        alias /opt/gestor-documental/proyecto/backend/staticfiles/;
        expires 7d;
    }

    location /media/ {
        alias /opt/gestor-documental/proyecto/backend/media/;
    }

    location / {
        proxy_pass http://gestor_documental;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
